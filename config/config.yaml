testing:
  sampling:
    measurements_count: 10
    total_duration_seconds: 5
    sampling_frequency_hz: 2

ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"

simulation:
  noise_rate: 0.05
  spike_rate: 0.02
  drop_rate: 0.01
  enabled: false

analysis:
  statistical_metrics: true

result_management:
  save_results: true
  output_format: "json"